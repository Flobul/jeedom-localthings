name: Generate translations
on:
  workflow_dispatch:
concurrency:
  group: translations-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check whether DeepL generation is configured
        id: deepl
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::notice::Translation generation skipped: repository secret DEEPL_API_KEY is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.deepl.outputs.configured == 'true'
        with:
          path: plugin
      - uses: actions/checkout@v7
        if: steps.deepl.outputs.configured == 'true'
        with:
          repository: jeedom/core
          ref: '90a95f1dcef74a65d77374a1fed427541032fe82'
          path: jeedom_core
      - uses: actions/checkout@v7
        if: steps.deepl.outputs.configured == 'true'
        with:
          repository: jeedom/jeetranslate
          ref: 'f16119803e0c5b74d4867ee231ba0f983db3f502'
          path: jeetranslate-tool
      - uses: actions/setup-python@v7
        if: steps.deepl.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jeetranslate-tool/requirements.txt
      - name: Install pinned translator dependencies
        if: steps.deepl.outputs.configured == 'true'
        run: python -m pip install -r jeetranslate-tool/requirements.txt
      - name: Snapshot existing non-empty manual translations
        if: steps.deepl.outputs.configured == 'true'
        run: python plugin/.github/ci/preserve_manual_i18n.py snapshot --root plugin --snapshot "$RUNNER_TEMP/manual-i18n.json"
      - name: Generate translations without overwriting existing manual values
        if: steps.deepl.outputs.configured == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/jeetranslate-tool
          source_language: fr_FR
          target_languages: 'de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT'
          deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
          include_empty_translation: 'true'
          use_core_translations: 'true'
          generate_source_language_translations: 'true'
          debug: 'false'
        run: python -m jeetranslate
      - name: Restore every existing non-empty manual translation
        if: steps.deepl.outputs.configured == 'true'
        run: python plugin/.github/ci/preserve_manual_i18n.py restore --root plugin --snapshot "$RUNNER_TEMP/manual-i18n.json"
      - name: Restore the plugin's declared language list
        if: steps.deepl.outputs.configured == 'true'
        run: python plugin/.github/ci/restore_i18n_languages.py --root plugin --languages de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT
      - name: Validate generated translations and placeholders
        if: steps.deepl.outputs.configured == 'true'
        run: python plugin/.github/ci/validate_i18n.py --root plugin --expected de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT --require-languages
      - name: Verify generation closes every pre-Release translation gap
        if: steps.deepl.outputs.configured == 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/generated-pre-release-translation.json"
          python plugin/.github/ci/pre_release_translation.py \
            --root plugin \
            --release-action create-tag-and-release \
            --mode enforce \
            --translation-pr-open false \
            --translation-attempt-exists false \
            --core-source jeedom_core/core/i18n/fr_FR.json \
            --report "$report"
          python - "$report" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("release_allowed") is not True:
              count = int(report.get("missing_count", 0))
              reason = str(report.get("reason", "translation-gate-failed"))
              raise SystemExit(f"Generated translations remain incomplete: reason={reason}, missing_count={count}")
          PY
      - name: Open or update the translation pull request
        id: translation_pr
        if: steps.deepl.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: plugin
          branch: translations
          delete-branch: true
          add-paths: |
            core/i18n/*.json
            plugin_info/info.json
          title: '[CI] Update translations'
          commit-message: 'chore(i18n): update translations'
          body: |
            Translation generated by the repository-local workflow with the pinned jeedom/jeetranslate engine.
            Manual translations are reused; placeholders and JSON structure are validated before this pull request is created.
      - name: Merge the validated translation update automatically
        if: >-
          steps.deepl.outputs.configured == 'true' &&
          steps.translation_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.translation_pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.translation_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          merged=false
          last_merge_error=""
          for attempt in 1 2 3 4 5; do
            pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid)"
            state="$(printf '%s' "$pr_json" | jq -r '.state')"
            actual_head="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
            if [ "$actual_head" != "$PR_HEAD_SHA" ]; then
              echo "Translation pull request changed after validation; refusing to merge" >&2
              exit 1
            fi
            if [ "$state" = "MERGED" ]; then
              merged=true
              break
            fi
            if ! last_merge_error="$(gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$PR_HEAD_SHA" 2>&1)"; then
              :
            fi
            state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            if [ "$state" = "MERGED" ]; then
              merged=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$merged" != "true" ]; then
            printf 'Validated translation pull request was not merged: %s\n' "$last_merge_error" >&2
            exit 1
          fi
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          for attempt in 1 2 3 4 5; do
            default_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
            relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$default_sha" --jq '.status')"
            if [ "$relation" = "identical" ] || [ "$relation" = "ahead" ]; then
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Merged translation commit is not reachable from the default branch" >&2
          exit 1
